name: release

# Build artifacts only for tagged releases, never on normal pushes.
# Usage: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # required to create the GitHub Release + upload assets

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Headless tools (CLI + MCP server)
        run: |
          dart compile exe bin/logchard.dart -o build/linux/x64/release/bundle/logchard
          dart compile exe bin/mcp_server.dart -o build/linux/x64/release/bundle/logchard-mcp
      - name: Package
        run: tar czf log-chard-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: softprops/action-gh-release@v2
        with:
          files: log-chard-linux-x64.tar.gz
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Headless tools (CLI + MCP server)
        run: |
          dart compile exe bin/logchard.dart -o build\windows\x64\runner\Release\logchard.exe
          dart compile exe bin/mcp_server.dart -o build\windows\x64\runner\Release\logchard-mcp.exe
      - name: Package
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath log-chard-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: log-chard-windows-x64.zip
          generate_release_notes: true
