name: pty
description: Pty for Dart and Flutter. Provides the ability to create processes with pseudo terminal file descriptors.
version: 0.2.2-pre.1
homepage: https://github.com/TerminalStudio/pty
# Vendored for LogChard. Local patches:
# - linux: resolve forkpty from libc/libutil.so.1 (Fedora has no libutil.so)
# - windows: unique pipe names per instance (was fixed \\.\pipe\mypipe)
# - unix: removed hardcoded '-l' argument injection

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  win32: ^2.1.0
  ffi: ^1.0.0

dev_dependencies:
  pedantic: ^1.10.0
  test: ^1.16.4
